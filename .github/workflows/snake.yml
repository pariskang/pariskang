name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */24 * * *"   # once a day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: pariskang
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#38ef7d&color_dots=#0b1f1c,#125c4e,#11998e,#1fd6a6,#38ef7d

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
